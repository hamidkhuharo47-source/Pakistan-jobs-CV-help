
name: RSS Feed Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  rss-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Pakistan jobs RSS feed
        run: |
          curl -L --fail --silent --show-error \
            "https://www.careermidway.com/rss/pakistan.xml" \
            -o feed.xml

      - name: Extract jobs and update database
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import json
          from datetime import date, timedelta

          root = ET.parse("feed.xml").getroot()

          def local_name(tag):
              return tag.split("}")[-1].lower()

          def get_text(element, names):
              for child in element.iter():
                  if local_name(child.tag) in names:
                      value = "".join(child.itertext()).strip()
                      if value:
                          return value
              return ""

          entries = [
              element for element in root.iter()
              if local_name(element.tag) in ("item", "entry")
          ]

          jobs = []

          for item in entries:
              title = get_text(item, {"title"})
              link = ""

              for child in item.iter():
                  if local_name(child.tag) == "link":
                      link = (
                          child.attrib.get("href", "")
                          or "".join(child.itertext()).strip()
                      )
                      if link:
                          break

              published = get_text(
                  item, {"pubdate", "published", "updated"}
              )
              description = get_text(
                  item, {"description", "summary", "content"}
              )

              if title and link:
                  jobs.append({
                      "title": title,
                      "link": link,
                      "published": published,
                      "description": description
                  })

          today = date.today()

          def classify(job):
              text = (
                  job["title"] + " " + job["description"]
              ).lower()

              banking_employers = [
                  "nrsp microfinance bank",
                  "bank of punjab",
                  "national bank of pakistan",
                  "state bank of pakistan",
                  "habib bank",
                  "muslim commercial bank",
                  "united bank limited",
                  "allied bank",
                  "meezan bank",
                  "faysal bank",
                  "askari bank",
                  "bank alfalah",
                  "soneri bank"
              ]

              government_employers = [
                  "pakistan mineral development corporation",
                  "islamabad club",
                  "government of pakistan",
                  "government of punjab",
                  "government of sindh",
                  "government of kpk",
                  "government of balochistan",
                  "ministry of",
                  "federal government",
                  "provincial government",
                  "public service commission",
                  "fpsc", "ppsc", "spsc", "kppsc"
              ]

              private_employers = [
                  "pakistan oilfields limited",
                  "ftc management company",
                  "malir university of science and technology",
                  "malir medical college"
              ]

              if any(name in text for name in banking_employers):
                  return "Banking", "Employer identified"

              if any(name in text for name in government_employers):
                  return "Government", "Employer identified"

              if any(name in text for name in private_employers):
                  return "Private", "Employer identified"

              return "Needs Verification", "Employer not clearly identified"

          try:
              with open("jobs-database.json", encoding="utf-8") as f:
                  database = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              database = {"jobs": []}

          if not isinstance(database.get("jobs"), list):
              database = {"jobs": []}

          existing = {
              record.get("link"): record
              for record in database["jobs"]
              if record.get("link")
          }

          added = 0

          for job in jobs:
              category, category_note = classify(job)
              link = job["link"]

              if link in existing:
                  record = existing[link]
                  record.update(job)
              else:
                  record = {
                      **job,
                      "first_seen": today.isoformat(),
                      "last_seen": today.isoformat(),
                      "review_after": (
                          today + timedelta(days=30)
                      ).isoformat(),
                      "status": "Unverified"
                  }
                  database["jobs"].append(record)
                  existing[link] = record
                  added += 1

              record["category"] = category
              record["category_note"] = category_note
              record["last_seen"] = today.isoformat()

          needs_review = 0

          for record in database["jobs"]:
               last_seen_text = record.get("last_seen") or record.get("first_seen")

               if last_seen_text:
                  last_seen = date.fromisoformat(last_seen_text)

                  if today - last_seen >= timedelta(days=30):
                      record["status"] = "Needs Review"
                  elif not record.get("status"):
                      record["status"] = "Unverified"

               if record.get("status") == "Needs Review":
                   needs_review += 1

          with open("jobs-database.json", "w", encoding="utf-8") as f:
              json.dump(database, f, ensure_ascii=False, indent=2)

          with open("test_jobs.json", "w", encoding="utf-8") as f:
              json.dump(jobs, f, ensure_ascii=False, indent=2)

          print(f"Feed listings found: {len(jobs)}")
          print(f"New jobs added: {added}")
          print(f"Total jobs in database: {len(database['jobs'])}")
          print(f"Jobs needing review: {needs_review}")

          for category in [
              "Government", "Banking", "Private",
              "Needs Verification"
          ]:
              count = sum(
                  1 for record in database["jobs"]
                  if record.get("category") == category
              )
              print(f"{category}: {count}")

          PY

      - name: Save database to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-database.json
          git diff --cached --quiet || (
            git commit -m "Update automatic jobs database" &&
            git push
          )

      - name: Save test results
        uses: actions/upload-artifact@v4
        with:
          name: rss-test-results
          path: |
            feed.xml
            test_jobs.json
            website-preview.json
          retention-days: 7
          
      - name: Generate website preview
        run: |
          python - <<'PY'
          import json

          with open("jobs-database.json", encoding="utf-8") as f:
              database = json.load(f)

          companies = [
              "NRSP Microfinance Bank",
              "Pakistan Oilfields Limited",
              "National Bank of Pakistan",
              "State Bank of Pakistan",
              "Malir University of Science and Technology",
              "Malir Medical College",
              "FTC Management Company"
          ]

          cities = [
              "Hyderabad", "Karachi", "Lahore", "Islamabad",
              "Rawalpindi", "Peshawar", "Quetta", "Multan",
              "Faisalabad", "Sukkur"
          ]

          preview = []

          for job in database.get("jobs", []):
              title = job.get("title", "")
              description = job.get("description", "")
              text = (title + " " + description).lower()

              company = "Needs Verification"
              for name in companies:
                  if name.lower() in text:
                      company = name
                      break

              city = "Needs Verification"
              for name in cities:
                  if name.lower() in text:
                      city = name
                      break

              preview.append({
                  "title": title,
                  "company": company,
                  "city": city,
                  "category": job.get("category", "Needs Verification"),
                  "status": job.get("status", "Unknown"),
                  "source": job.get("link", ""),
                  "description": description
              })

          with open("website-preview.json", "w", encoding="utf-8") as f:
              json.dump(preview, f, ensure_ascii=False, indent=2)
          
          print("Website preview created:", len(preview), "jobs")
          PY
          
          

      - name: Upload website preview
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: website-preview.json
          retention-days: 7

      - name: Check all job links
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          with open("jobs-database.json", encoding="utf-8") as f:
              database = json.load(f)

          results = []

          for job in database.get("jobs", []):
              url = job.get("link", "").strip()
              result = {
                  "title": job.get("title", ""),
                  "link": url,
                  "status": "Check Failed",
                  "http_code": None
              }

              if not url:
                  result["status"] = "No Link"
                  results.append(result)
                  continue

              request = Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              try:
                  with urlopen(request, timeout=10) as response:
                      code = response.getcode()
                      result["http_code"] = code

                      if 200 <= code < 400:
                          result["status"] = "Link OK"
                      else:
                          result["status"] = "HTTP Error"

              except HTTPError as e:
                  result["http_code"] = e.code

                  if e.code in (403, 405, 429):
                      result["status"] = "Blocked - Manual Check"
                  elif e.code in (404, 410):
                      result["status"] = "Broken Link"
                  else:
                      result["status"] = "HTTP Error"

              except (URLError, TimeoutError, Exception) as e:
                  result["status"] = "Check Failed"
                  result["error"] = str(e)[:200]

              results.append(result)
              time.sleep(2)
              print(result["status"], "-", result["title"])

          with open("link-check-results.json", "w", encoding="utf-8") as f:
              json.dump(results, f, ensure_ascii=False, indent=2)

          print("Links checked:", len(results))
          PY

      - name: Upload link check report
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: link-check-results.json
          retention-days: 7

          
